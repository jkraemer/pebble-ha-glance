# Tests and builds the app on every push and pull request. The package is
# built from a clean checkout, so it carries no settings, and is kept as an
# artifact of the run.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    # The emulator needs glibc 2.38 or newer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v10
        with:
          # Only the pebble tool is installed with uv: there are no Python
          # dependencies to cache.
          enable-cache: false

      # What the Pebble SDK and its emulator need, as the SDK documentation lists it.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g libsndio7.0

      - name: Install the Pebble SDK
        run: |
          uv tool install pebble-tool --python 3.13
          pebble sdk install latest

      - name: Install JavaScript packages
        run: npm ci

      - name: Host tests
        run: make test

      - name: Build
        run: pebble build

      - uses: actions/upload-artifact@v7
        with:
          name: pebble-ha-glance.pbw
          # The package is named after the checkout's directory.
          path: build/*.pbw

      # Last, because it builds with the development settings and removes that build again.
      - name: Emulator test
        run: make test-emulator
